---
name: Bump Version

on:
  workflow_call:
    inputs:
      bump_type:
        description: "Version bump type: patch, minor, or major"
        required: true
        type: string
      python_version:
        description: "Python version for actions/setup-python (ignored when use_uv is true)"
        required: false
        type: string
        default: "3.13"
      bump_my_version_pin:
        description: "Pip version spec for bump-my-version (ignored when use_uv is true)"
        required: false
        type: string
        default: "1.3.0"
      branch_prefix:
        description: "Prefix for the bump branch name"
        required: false
        type: string
        default: "bump"
      pr_title_template:
        description: "PR title template ({previous} and {current} are substituted)"
        required: false
        type: string
        default: "chore(release): bump {previous} → {current}"
      open_pr:
        description: "Open a PR after pushing the bump branch (set to 'false' to skip)"
        required: false
        type: string
        default: "true"
      # --- uv / scriv opt-ins (default false; fully backwards-compatible) ---
      use_uv:
        description: "Use uv instead of pip for bump-my-version (requires uv-managed project with bump-my-version as a dependency)"
        required: false
        type: boolean
        default: false
      sync_lockfile:
        description: "Run 'uv lock' after bumping to sync uv.lock (requires uv; typically paired with use_uv)"
        required: false
        type: boolean
        default: false
      collect_scriv:
        description: "Run 'scriv collect' to fold changelog.d/ fragments into CHANGELOG.md before the signed commit (requires uv with scriv installed)"
        required: false
        type: boolean
        default: false
      # --- monorepo opt-ins (defaults keep existing behaviour) ---
      config_file:
        description: "bump-my-version config file relative to the repo root (default: auto-discovery)"
        required: false
        type: string
        default: ""
      lockfile_dirs:
        description: "Space-separated directories to run 'uv lock' in when sync_lockfile is true"
        required: false
        type: string
        default: "."
    outputs:
      previous_version:
        description: "Version before bump"
        value: ${{ jobs.bump.outputs.previous_version }}
      current_version:
        description: "Version after bump"
        value: ${{ jobs.bump.outputs.current_version }}
      branch:
        description: "Bump branch name"
        value: ${{ jobs.bump.outputs.branch }}
      pr_url:
        description: "PR URL (empty when open_pr=false)"
        value: ${{ jobs.bump.outputs.pr_url }}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      previous_version: ${{ steps.bump.outputs.previous_version }}
      current_version: ${{ steps.bump.outputs.current_version }}
      branch: ${{ steps.commit.outputs.branch }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    env:
      REPO: ${{ github.repository }}
      BASE_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # pip path: set up Python when not using uv
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        if: ${{ !inputs.use_uv }}
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install bump-my-version (pip path)
        if: ${{ !inputs.use_uv }}
        env:
          PIN: ${{ inputs.bump_my_version_pin }}
        run: pip install "bump-my-version==$PIN"

      # uv path: set up uv when any uv opt-in is active
      - name: Setup uv
        if: ${{ inputs.use_uv || inputs.sync_lockfile || inputs.collect_scriv }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Bump version (files only)
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          USE_UV: ${{ inputs.use_uv }}
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          set -euo pipefail
          if [ "$USE_UV" = "true" ]; then
            bmv=(uv run bump-my-version)
          else
            bmv=(bump-my-version)
          fi
          cfg=()
          if [ -n "$CONFIG_FILE" ]; then
            cfg=(--config-file "$CONFIG_FILE")
          fi
          previous=$("${bmv[@]}" show "${cfg[@]}" current_version)
          # --no-commit: the signed-commit step below builds the commit from the
          # working-tree diff, so a local commit (config `commit = true`) would
          # leave it empty. --no-tag: tag-release.yml tags main's squash-merge commit.
          "${bmv[@]}" bump "${cfg[@]}" --no-commit --no-tag "$BUMP_TYPE"
          current=$("${bmv[@]}" show "${cfg[@]}" current_version)
          echo "previous_version=$previous" >> "$GITHUB_OUTPUT"
          echo "current_version=$current" >> "$GITHUB_OUTPUT"

      - name: Sync uv.lock
        if: inputs.sync_lockfile
        env:
          LOCKFILE_DIRS: ${{ inputs.lockfile_dirs }}
        run: |
          set -euo pipefail
          # bump-my-version patches version files but not uv.lock; sync it so the
          # project entry in the lockfile matches the bumped pyproject version.
          read -ra dirs <<< "$LOCKFILE_DIRS"
          for dir in "${dirs[@]}"; do
            uv lock --directory "$dir"
          done

      - name: Collect changelog fragments (scriv)
        if: inputs.collect_scriv
        env:
          NEW_VERSION: ${{ steps.bump.outputs.current_version }}
        run: |
          set -euo pipefail
          if ls changelog.d/*.md >/dev/null 2>&1; then
            uv run scriv collect --version "$NEW_VERSION"
          else
            echo "no changelog fragments to collect"
          fi

      - name: Signed commit and push branch
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV: ${{ steps.bump.outputs.previous_version }}
          CURR: ${{ steps.bump.outputs.current_version }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BRANCH="$BRANCH_PREFIX-$RUN_NUMBER-$BASE_REF"

          # Commit via the GraphQL createCommitOnBranch mutation instead of the
          # low-level Git Data API. Two reasons (see qte77/.github#40):
          #  1. GitHub signs createCommitOnBranch commits with its web-flow key,
          #     so consumers whose main enforces `required_signatures` accept the
          #     release commit (the Git Data API path produced UNSIGNED commits).
          #  2. File contents ride in the request BODY (base64 additions), not an
          #     argv CLI arg, so a large uv.lock never hits 'Argument list too
          #     long' (supersedes the --input workaround in #36 / issue #38).
          BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/$BASE_REF" --jq '.object.sha')

          # createCommitOnBranch applies fileChanges onto an existing branch ref,
          # so point the bump branch at the base commit first (force-reset a stale
          # ref left by a re-run of the same run number).
          gh api "repos/$REPO/git/refs/heads/$BRANCH" -X PATCH -f sha="$BASE_SHA" -F force=true 2>/dev/null \
            || gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA"

          # Additions = every modified/added tracked file; deletions = scriv
          # fragments removed by `scriv collect` (fires only when collect_scriv is
          # true and fragments exist). Same file enumeration as the prior step.
          # Contents and the additions list stay in files (jq --rawfile/--slurpfile)
          # so a large file, e.g. a grown uv.lock, never hits the 128KB
          # single-argument limit (MAX_ARG_STRLEN) that jq --arg/--argjson would. #38.
          ADDITIONS="$RUNNER_TEMP/additions.json"
          echo '[]' > "$ADDITIONS"
          for file in $(git diff --name-only --diff-filter=d); do
            base64 -w0 "$file" | tr -d '\n' > "$RUNNER_TEMP/blob.b64"
            jq -c --arg path "$file" --rawfile contents "$RUNNER_TEMP/blob.b64" \
              '. + [{path: $path, contents: $contents}]' "$ADDITIONS" > "$ADDITIONS.tmp"
            mv "$ADDITIONS.tmp" "$ADDITIONS"
          done

          DELETIONS="[]"
          for file in $(git diff --name-only --diff-filter=D); do
            DELETIONS=$(jq -c --arg path "$file" '. + [{path: $path}]' <<<"$DELETIONS")
          done

          COMMIT_OID=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$BASE_SHA" \
            --arg headline "Bump version: $PREV -> $CURR" \
            --slurpfile additions "$ADDITIONS" \
            --argjson deletions "$DELETIONS" \
            '{query: "mutation($i: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $i) { commit { oid } } }",
              variables: {i: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $oid,
                fileChanges: {additions: $additions[0], deletions: $deletions}}}}' \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')

          if [ -z "$COMMIT_OID" ] || [ "$COMMIT_OID" = "null" ]; then
            echo "::error::createCommitOnBranch returned no commit oid"; exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create PR
        id: pr
        if: inputs.open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV: ${{ steps.bump.outputs.previous_version }}
          CURR: ${{ steps.bump.outputs.current_version }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TEMPLATE: ${{ inputs.pr_title_template }}
        run: |
          title="${TEMPLATE//\{previous\}/$PREV}"
          title="${title//\{current\}/$CURR}"
          body="Automated version bump from \`$PREV\` to \`$CURR\` on \`$BRANCH\`."
          pr_url=$(gh pr create \
            --base "$BASE_REF" \
            --head "$BRANCH" \
            --title "$title" \
            --body "$body")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Cleanup on failure
        # Cleanup intentionally omits tag/release deletion: GitHub's release
        # immutability remembers deleted tag names forever, so deleting on
        # failure permanently burns the version number. See qte77/.github#23.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BRANCH="$BRANCH_PREFIX-$RUN_NUMBER-$BASE_REF"
          gh pr close "$BRANCH" --comment "Closing PR '$BRANCH' to rollback after failure" 2>/dev/null || true
          gh api "repos/$REPO/git/refs/heads/$BRANCH" -X DELETE 2>/dev/null || true
