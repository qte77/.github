---
name: Validate Workflows

# Lint and security-scan all workflows in this repo on every push and PR.
# Dogfoods the reusable lint-actions.yml (actionlint, yamllint, zizmor).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint-actions.yml
