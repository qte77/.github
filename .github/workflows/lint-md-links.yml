---
# Reusable workflow: Markdown + link linting (markdownlint-cli2 + lychee).
#
# CALLER PERMISSIONS REQUIRED:
#   permissions:
#     contents: read
#     issues:   write   # required at workflow startup; see note below
#
# The `notify` job keeps one open `report`+`automated` issue per ref while
# runs fail and closes it on the next green run. It declares
# `permissions: issues: write` unconditionally.
# GitHub validates ALL reusable-job permissions at workflow startup, BEFORE
# evaluating `if:` expressions — so callers must grant `issues: write` even
# when `notify_on_failure: false` (the default). Omitting it yields
# `startup_failure` on every run, despite the notify job being skipped at
# runtime.
#
# See README "Permissions required" for the bare-minimum caller shape.
name: Lint MD and Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"  # weekly Sunday 00:00 UTC; only fires for qte77/.github itself
  workflow_dispatch:
  workflow_call:
    inputs:
      notify_on_failure:
        description: "Create a GitHub issue on lint failure (use with cron callers). Default false. Callers must always grant `issues: write` regardless — see workflow header comment."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  markdown:
    # Skip markdown lint on scheduled runs — md content is stable post-merge;
    # only links rot independently. Schedule runs only check links.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Fall back to shared markdownlint config
        run: |
          # Every config filename markdownlint-cli2 discovers (see its README "Configuration")
          for f in .markdownlint-cli2.jsonc .markdownlint-cli2.yaml .markdownlint-cli2.cjs .markdownlint-cli2.mjs \
                   .markdownlint.jsonc .markdownlint.json .markdownlint.yaml .markdownlint.yml \
                   .markdownlint.cjs .markdownlint.mjs; do
            if [ -f "$f" ]; then exit 0; fi
          done
          curl -fsSL https://raw.githubusercontent.com/qte77/.github/main/.markdownlint.jsonc -o .markdownlint.jsonc
      - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9  # v23.0.0

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Fall back to shared lychee config
        run: |
          if [ ! -f lychee.toml ] && [ ! -f .lychee.toml ]; then
            curl -fsSL https://raw.githubusercontent.com/qte77/.github/main/lychee.toml -o lychee.toml
          fi
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          args: --no-progress '**/*.md'
          fail: true

  notify:
    needs: [markdown, links]
    # Runs after every opted-in run (not only failures) so a green run can
    # close the open report. Skipped at runtime when notify_on_failure is
    # false (the default), but the `permissions: issues: write` declaration
    # below is still validated at startup — callers must grant it regardless.
    # See workflow header.
    if: always() && inputs.notify_on_failure
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        with:
          script: |
            // One open labelled issue per ref: comment on it while failing,
            // close it on the next green run. Cancelled runs change nothing.
            const results = process.env.RESULTS.split(' ');
            if (results.includes('cancelled')) return;
            const failed = results.includes('failure');
            const { owner, repo } = context.repo;
            const title = `Lint MD and Links: failure on ${context.ref}`;
            const labels = ['report', 'automated'];
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: labels.join(','), per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (failed && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Still failing.\n\nRun: ${runUrl}`,
              });
            } else if (failed) {
              await github.rest.issues.create({
                owner, repo, title, labels,
                body: `One or more lint jobs failed.\n\nRun: ${runUrl}`,
              });
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Green again, closing.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
              });
            }
