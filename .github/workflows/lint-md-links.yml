---
name: Lint MD and Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"  # weekly Sunday 00:00 UTC; only fires for qte77/.github itself
  workflow_dispatch:
  workflow_call:
    inputs:
      notify_on_failure:
        description: "Create an issue if a lint job fails (use with cron callers)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  markdown:
    # Skip markdown lint on scheduled runs — md content is stable post-merge;
    # only links rot independently. Schedule runs only check links.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Fall back to shared markdownlint config
        run: |
          if [ ! -f .markdownlint.jsonc ] && [ ! -f .markdownlint.json ]; then
            curl -fsSL https://raw.githubusercontent.com/qte77/.github/main/.markdownlint.jsonc -o .markdownlint.jsonc
          fi
      - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9  # v23.0.0

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Fall back to shared lychee config
        run: |
          if [ ! -f lychee.toml ] && [ ! -f .lychee.toml ]; then
            curl -fsSL https://raw.githubusercontent.com/qte77/.github/main/lychee.toml -o lychee.toml
          fi
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          args: --no-progress '**/*.md'
          fail: true

  notify:
    needs: [markdown, links]
    if: failure() && inputs.notify_on_failure
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71  # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Lint MD and Links: failure on ${context.ref}`,
              body: `One or more lint jobs failed.\n\nRun: ${runUrl}`,
              labels: ['report', 'automated']
            });
...
