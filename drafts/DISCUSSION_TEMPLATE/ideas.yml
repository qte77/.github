title: "[Idea] "
labels: ["discussion", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! Please describe it clearly so others can
        engage. This is not a feature request — use issues for concrete,
        actionable proposals.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the idea.
      placeholder: "What if we..."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why this one seems better.
    validations:
      required: false
